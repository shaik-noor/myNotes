name: mynotes_mobile
description: "MyNotes - Personal Knowledge & Document Workspace (Native iOS App)"
publish_to: 'none'
version: 1.2.3+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Apple HIG
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Networking & Google Drive
  http: ^1.3.0
  url_launcher: ^6.3.1

  # Local Persistence & Offline Sync
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # Markdown & Content Formatting
  flutter_markdown: ^0.7.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (e.g. v1.2.2)'
        required: true
        default: 'v1.2.2'
      macos_signing:
        description: 'Ad-hoc builds require Open Anyway on macOS'
        type: choice
        options:
          - ad-hoc
          - notarized
        default: ad-hoc

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  MACOS_SIGNING: ${{ inputs.macos_signing || vars.MACOS_SIGNING || 'ad-hoc' }}

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-14'
            args: '--bundles dmg,app --config src-tauri/tauri.release.conf.json'
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Check release version
        shell: bash
        run: |
          node --test scripts/test-release.mjs
          node scripts/release-notes.mjs > release-body.md

      - name: Configure macOS SDK
        if: runner.os == 'macOS'
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Validate app
        run: npm run validate

      - name: Test native app
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/configure-macos-signing.mjs

      # Build only. Publish after both platforms pass and macOS is verified.
      - name: Build Tauri assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && env.MACOS_SIGNING == 'notarized' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && env.MACOS_SIGNING == 'notarized' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.MACOS_SIGNING == 'notarized' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && env.MACOS_SIGNING == 'notarized' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && env.MACOS_SIGNING == 'notarized' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && env.MACOS_SIGNING == 'notarized' && secrets.APPLE_TEAM_ID || '' }}
        with:
          args: ${{ matrix.args }} --ci -- --locked

      - name: Verify macOS package
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos.sh "$MACOS_SIGNING"

      - name: Stage installers
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} release-assets/ \;
          cp docs/MACOS_INSTALL.md release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Generate release notes and checksums
        run: |
          node scripts/release-notes.mjs > release-body.md
          cd release-assets
          sha256sum *.dmg *.exe *.msi MACOS_INSTALL.md > SHA256SUMS.txt
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "MyNotes $RELEASE_TAG" --notes-file release-body.md

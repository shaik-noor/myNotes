[package]
name = "mynotes"
version = "1.2.1"
description = "MyNotes - Personal Knowledge & Document Workspace"
authors = ["Shaik"]
edition = "2021"

[lib]
name = "mynotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
tiny_http = "0.12"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
hex = "0.4"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSColor"] }
